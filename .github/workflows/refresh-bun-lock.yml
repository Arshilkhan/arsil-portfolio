name: Refresh Bun Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Update vulnerable dependencies
        run: bun update @tanstack/react-start @tanstack/start-server-core

      - name: Check resolved versions
        run: |
          grep -E '"@tanstack/(react-start|start-server-core)"' bun.lock

      - name: Commit updated lockfile
        run: |
          git add bun.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: update vulnerable TanStack dependencies"
          git push origin main
